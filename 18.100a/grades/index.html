<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>18.100a grades — Joshua Flynn</title>
  <link rel="stylesheet" href="/assets/site.css">

  <style>
    .grades-tree-row {
      display: flex;
      align-items: flex-start;
      min-height: 1.75em;
    }

    .grades-tree-branch {
      flex: 0 0 auto;
      color: var(--tree);
      white-space: pre;
    }

    .grades-tree-entry {
      min-width: 0;
      color: var(--text);
    }
  </style>
</head>

<body>
  <main>
    <div class="content-grid">

      <section class="nav-column">
        <header>
          <h1>Joshua Flynn</h1>
          <p class="subtitle">NSF Postdoctoral Fellow</p>
          <p class="subtitle">MIT, Mathematics</p>
        </header>

        <nav
          id="site-tree"
          class="tree"
          data-active="18-100a-grades"
          aria-label="Site navigation">
        </nav>
      </section>

      <section class="content-panel">
        <div class="course-tree">
          <div class="course-root">grades/</div>

          <div class="grades-tree-row">
            <span class="grades-tree-branch">├── </span>
            <span class="grades-tree-entry">12.5% - psets</span>
          </div>

          <div class="grades-tree-row">
            <span class="grades-tree-branch">├── </span>
            <span class="grades-tree-entry">12.5% - quizzes</span>
          </div>

          <div class="grades-tree-row">
            <span class="grades-tree-branch">├── </span>
            <span class="grades-tree-entry">25% - exam 1</span>
          </div>

          <div class="grades-tree-row">
            <span class="grades-tree-branch">├── </span>
            <span class="grades-tree-entry">25% - exam 2</span>
          </div>

          <div class="grades-tree-row">
            <span class="grades-tree-branch">└── </span>
            <span class="grades-tree-entry">25% - exam 3</span>
          </div>

          <div class="grades-tree-row">
            <span class="grades-tree-branch">    └── </span>
            <span class="grades-tree-entry">administered during the final-exam period</span>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script src="/assets/site-nav.js"></script>
</body>
</html>
