<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teaching — Joshua Flynn</title>
  <link rel="stylesheet" href="/assets/site.css">

  <style>
    .teaching-panel {
      max-width: 760px;
    }

    .teaching-graph {
      display: block;
      width: min(330px, 100%);
      height: auto;
      margin: 0 auto;
      position: relative;
      left: 24px;
    }

    .graph-node {
      cursor: pointer;
    }

    .graph-hit {
      fill: transparent;
    }

    .graph-dot {
      fill: var(--text);
    }

    @media (max-width: 820px) {
      .teaching-graph {
        left: 0;
      }
    }
  </style>
</head>

<body>
  <main>
    <div class="content-grid">

      <section class="nav-column">
        <header>
          <h1>Joshua Flynn</h1>
          <p class="subtitle">NSF Postdoctoral Fellow</p>
          <p class="subtitle">MIT, Mathematics</p>
        </header>

        <nav
          id="site-tree"
          class="tree"
          data-active="teaching"
          aria-label="Site navigation">
        </nav>
      </section>

      <section class="content-panel teaching-panel" aria-label="Teaching graph">
        <svg
          class="teaching-graph"
          viewBox="85 55 350 410"
          role="img"
          aria-label="Teaching graph">

          <a class="graph-node" href="/mcgill/" aria-label="McGill">
            <circle class="graph-hit" cx="108" cy="62" r="13"></circle>
            <circle class="graph-dot" cx="108" cy="62" r="4.5"></circle>
          </a>

          <a class="graph-node" href="/uconn/" aria-label="UConn">
            <circle class="graph-hit" cx="258" cy="447" r="13"></circle>
            <circle class="graph-dot" cx="258" cy="447" r="4.5"></circle>
          </a>

          <a class="graph-node" href="/mit/" aria-label="MIT">
            <circle class="graph-hit" cx="401" cy="369" r="13"></circle>
            <circle class="graph-dot" cx="401" cy="369" r="4.5"></circle>
          </a>
        </svg>
      </section>

    </div>
  </main>

  <script src="/assets/site-nav.js"></script>
</body>
</html>
