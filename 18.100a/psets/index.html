<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>18.100a psets — Joshua Flynn</title>
  <link rel="stylesheet" href="/assets/site.css">

  <style>
    .nested-tree-row {
      display: flex;
      align-items: flex-start;
      min-height: 1.75em;
    }

    .nested-tree-branch {
      flex: 0 0 auto;
      color: var(--tree);
      white-space: pre;
    }

    .nested-tree-entry {
      min-width: 0;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main>
    <div class="content-grid">
      <section class="nav-column">
        <header>
          <h1>Joshua Flynn</h1>
          <p class="subtitle">NSF Postdoctoral Fellow</p>
          <p class="subtitle">MIT, Mathematics</p>
        </header>

        <nav
          id="site-tree"
          class="tree"
          data-active="18-100a-psets"
          aria-label="Site navigation">
        </nav>
      </section>

      <section class="content-panel">
        <div class="course-tree">
          <div class="course-root">psets/</div>

          <div class="nested-tree-row">
            <span class="nested-tree-branch">├── </span>
            <span class="nested-tree-entry">weekly</span>
          </div>

          <div class="nested-tree-row">
            <span class="nested-tree-branch">├── </span>
            <span class="nested-tree-entry">5 required problems/</span>
          </div>

          <div class="nested-tree-row">
            <span class="nested-tree-branch">│   ├── </span>
            <span class="nested-tree-entry">2 randomly graded</span>
          </div>

          <div class="nested-tree-row">
            <span class="nested-tree-branch">│   ├── </span>
            <span class="nested-tree-entry">3 graded for completion</span>
          </div>

          <div class="nested-tree-row">
            <span class="nested-tree-branch">│   └── </span>
            <span class="nested-tree-entry">relevant to exams</span>
          </div>

          <div class="nested-tree-row">
            <span class="nested-tree-branch">└── </span>
            <span class="nested-tree-entry">5 optional problems/</span>
          </div>

          <div class="nested-tree-row">
            <span class="nested-tree-branch">    ├── </span>
            <span class="nested-tree-entry">not graded whatsoever</span>
          </div>

          <div class="nested-tree-row">
            <span class="nested-tree-branch">    └── </span>
            <span class="nested-tree-entry">relevant to exams</span>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="/assets/site-nav.js"></script>
</body>
</html>
